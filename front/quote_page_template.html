<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>$metatitle - Domus Quietus Domus</title>

    <!-- Open Graph meta tags for social sharing -->
    <meta property="og:title" content="$metatitle">
    <meta property="og:image" content="https://domusquietusdomus.douady.paris/$imagepreviewxl">
    <meta property="og:description" content="">
    <meta property="og:url" content="https://domusquietusdomus.douady.paris/quotes/$id.html">
    <meta property="og:type" content="website">

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="$metatitle">
    <meta name="twitter:image" content="https://domusquietusdomus.douady.paris/$imagepreviewxl">
    <meta name="twitter:description" content="">

    <link rel="stylesheet" href="../assets/normalize.css">
    <link rel="stylesheet" href="../assets/$style">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed&display=swap" rel="stylesheet">
</head>
<body>
<div id="content">
    <p><a href="/">Revenir à la liste</a></p>
    <div class="quote quote-selected">
        <div class="quote-media">
            <img class="quote-image-preview" src="../$imagepreview" alt="Screenshot preview" loading="lazy">
            <img class="quote-image-full" src="../$imagefull" alt="Screenshot" loading="lazy">
            $clipplay
        </div>
        <div class="quote-content">
            <div class="quote-base">
                <div class="quote-title">
                    <div class="quote-timecode">$timecode</div>
                    $title
                </div>
                <div class="quote-share">
                    <img src="../assets/share.svg" height="16" width="16" onclick="sh('$id')" alt="Partager la citation" title="Partager la citation"/>
                    <img src="../assets/copy.svg" height="16" width="16" onclick="copyLink('$id', event)" alt="Copier le lien" title="Copier le lien" style="cursor:pointer"/>
                    $cliplink
                </div>
            </div>
            <div class="quote-expanded">
                $longtext
                $explanation
                $tags
            </div>
        </div>
    </div>
    $footer
</div>
</body>
<script>
function sh(id) {
    navigator.share({url: 'https://domusquietusdomus.douady.paris/quotes/' + id + '.html'});
}

// Plays the joke's clip over its screenshot (the play button only shows on an open joke).
function playClip(button, event) {
    event.stopPropagation();
    const media = button.parentElement;
    const video = document.createElement('video');
    video.className = 'quote-clip';
    video.src = button.dataset.clip;
    video.controls = true;
    video.playsInline = true;
    video.addEventListener('click', (e) => e.stopPropagation());
    media.appendChild(video);
    media.classList.add('playing');
    video.play();
}

function stopClips(container) {
    for (const media of container.querySelectorAll('.quote-media.playing')) {
        media.querySelectorAll('.quote-clip, .quote-gif-hint, .quote-gif-actions').forEach((el) => el.remove());
        media.classList.remove('playing');
    }
}

// Shows the joke's GIF over its screenshot (a second click hides it).
function showGif(link) {
    const quote = link.closest('.quote'), media = quote.querySelector('.quote-media');
    const shown = media.querySelector('img.quote-clip');
    stopClips(quote);
    if (shown && shown.src === link.href) return;
    const gif = document.createElement('img');
    gif.className = 'quote-clip';
    gif.src = link.href;
    gif.alt = 'GIF de l\'extrait';
    gif.title = 'Glisse le GIF dans une conversation';
    gif.addEventListener('click', (e) => e.stopPropagation());
    // The tip shows the first 3 times only (counted in this browser)
    let tips = 3;
    try { tips = Number(localStorage.getItem('gifTips')) || 0; localStorage.setItem('gifTips', tips + 1); } catch (e) {}
    if (tips < 3) {
        const hint = document.createElement('div');
        hint.className = 'quote-gif-hint';
        hint.textContent = 'Glisse le GIF dans la conversation';
        media.append(hint);
    }
    // A pasted link shows as an animated GIF in Discord, Slack, Messenger, Telegram...
    const actions = document.createElement('div');
    actions.className = 'quote-gif-actions';
    actions.addEventListener('click', (e) => e.stopPropagation());
    const copy = document.createElement('button');
    copy.textContent = 'Copier le lien';
    copy.onclick = () => navigator.clipboard.writeText(link.dataset.link || link.href).then(() => {
        copy.textContent = 'Lien copié ✓';
        setTimeout(() => { copy.textContent = 'Copier le lien'; }, 1500);
    });
    const save = document.createElement('a');
    save.textContent = 'Télécharger';
    save.href = link.href;
    save.download = link.getAttribute('download');
    actions.append(copy, save);
    media.append(gif, actions);
    media.classList.add('playing');
}

// On a phone, the clip / GIF icons hand the file to the share sheet (WhatsApp, Messages...) instead
// of downloading it. The file is fetched on the first tap; if that took too long for the browser to
// still allow sharing, the icon lights up and the next tap shares it at once.
// On a computer, the GIF shows over the screenshot, to drag into a chat, copy its link or download it
// (browsers only copy a still image to the clipboard, never an animated GIF).
const clipFiles = {};
async function shareClip(link, event) {
    if (!matchMedia('(pointer: coarse)').matches || !navigator.canShare) {
        if (link.getAttribute('download').endsWith('.gif')) {
            event.preventDefault();
            showGif(link);
        }
        return;  // the video: a plain download
    }
    event.preventDefault();
    const url = link.href, name = link.getAttribute('download');
    try {
        if (!clipFiles[url]) {
            link.classList.add('loading');
            const blob = await (await fetch(url)).blob();
            clipFiles[url] = new File([blob], name, {type: name.endsWith('.gif') ? 'image/gif' : 'video/mp4'});
            link.classList.remove('loading');
        }
        if (!navigator.canShare({files: [clipFiles[url]]})) throw new TypeError('cannot share this file');
        link.classList.remove('ready');
        await navigator.share({files: [clipFiles[url]]});
    } catch (e) {
        link.classList.remove('loading');
        if (e.name === 'AbortError') return;
        if (e.name === 'NotAllowedError' && clipFiles[url]) return link.classList.add('ready');
        const a = document.createElement('a');  // sharing files isn't possible here: download it
        a.href = clipFiles[url] ? URL.createObjectURL(clipFiles[url]) : url;
        a.download = name;
        a.click();
    }
}

function copyLink(id, event) {
    const url = 'https://domusquietusdomus.douady.paris/quotes/' + id + '.html';
    navigator.clipboard.writeText(url).then(() => {
        const img = event.target;
        const originalSrc = img.src;
        img.src = '../assets/check.svg';
        setTimeout(() => { img.src = originalSrc; }, 1500);
    });
}
</script>
</html>
